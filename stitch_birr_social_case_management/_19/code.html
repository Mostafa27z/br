<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md md:p-margin-desktop">

<div class="absolute inset-0 bg-cover bg-center w-full h-full" data-alt="A serene, minimalist modern workspace setting featuring subtle natural light, sleek modern furniture, and healthy green potted plants. The lighting is bright and high-key, creating a light-mode aesthetic. The color palette emphasizes clean whites, soft grays, and natural emerald greens to convey trust, growth, and professional social impact." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC6xqTMonZ2_pLaPt280F5vKzbHipqASrz-KK-DY4bQwm9hqaVrQbYUDphwlxKy1enmj7TVnWdlBRgYJ0J6Ko79xZG7DhpBdNsVY4H0MfiUAM8E8byIzTroHL8_WxoADD31OpNiyKg4qS3hO89uk3FBdaHzM8nl6vUubYS0lg_FfgFg2yV-6dK4i5HnZZSRZR5T-VajzoNbi3YmIkFhsoUKuWfLI4ELqqtP3AoJvgtcZuJXCebvDdL55A')"></div>
<div class="absolute inset-0 bg-primary/80 mix-blend-multiply"></div>
<div class="absolute inset-0 p-lg flex flex-col justify-between text-on-primary">
<div>
<div class="font-headline-lg text-headline-lg font-bold">نظام بر</div>
</div>
<div>
<h2 class="font-display-md text-display-md mb-sm">تمكين العطاء</h2>
<p class="font-body-lg text-body-lg opacity-90">منصة متكاملة لإدارة الحالات الاجتماعية وتقديم المساعدات بكفاءة وموثوقية.</p>
</div>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 p-lg md:p-xl flex flex-col justify-center">
<!-- Mobile Logo -->
<div class="md:hidden text-center mb-xl">
<div class="font-headline-lg text-headline-lg font-bold text-primary">نظام بر</div>
</div>
<div class="mb-xl">
<h1 class="font-headline-lg text-headline-lg mb-xs text-on-surface">تسجيل الدخول</h1>
<p class="font-body-md text-body-md text-on-surface-variant">أهلاً بك مجدداً، يرجى إدخال بياناتك للمتابعة.</p>
</div>
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="email">البريد الإلكتروني</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="mail">mail</span>
<input class="w-full bg-surface-container hover:bg-surface-container-high focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary border-outline-variant rounded-lg pl-sm pr-10 py-sm font-body-md text-body-md text-on-surface transition-colors" dir="ltr" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-xs">
<label class="block font-label-lg text-label-lg text-on-surface" for="password">كلمة المرور</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">نسيت كلمة المرور؟</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="lock">lock</span>
<input class="w-full bg-surface-container hover:bg-surface-container-high focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary border-outline-variant rounded-lg pl-sm pr-10 py-sm font-body-md text-body-md text-on-surface transition-colors" dir="ltr" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container" id="remember-me" name="remember-me" type="checkbox"/>
<label class="mr-sm font-body-md text-body-md text-on-surface-variant" for="remember-me">
                        تذكرني
                    </label>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center py-sm px-md border border-transparent rounded-lg shadow-sm font-label-lg text-label-lg text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200 active:scale-[0.98]" type="submit">
                        تسجيل الدخول
                    </button>
</div>
